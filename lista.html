<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casas con dulces</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎃</text></svg>">
<style>
  :root{--bg:#1d1424;--fg:#fff6ea;--nar:#ff8a1f;--card:#2c2036}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:22px;line-height:1.4}
  main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
  h1{font-size:32px;margin:8px 0 6px}
  .total{color:var(--nar);font-weight:700;margin-bottom:22px}
  .calle{background:var(--card);border-radius:18px;padding:16px 18px;margin-bottom:16px}
  .calle h2{font-size:24px;margin:0 0 12px}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{background:var(--nar);color:#1d1424;font-weight:800;font-size:26px;border-radius:14px;min-width:64px;padding:10px 14px;text-align:center}
  .nota{font-size:17px;opacity:.75;margin-top:24px}
  button{width:100%;min-height:64px;border-radius:16px;border:2px solid var(--nar);background:transparent;color:var(--fg);font-size:22px;font-weight:700;margin-top:12px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<main id="app"><p>Cargando…</p></main>
<script src="config.js"></script>
<script>
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function cargar(){
    document.getElementById('app').innerHTML = '<p>Cargando…</p>';
    apiGet('dulces')
      .then(pintar)
      .catch(function(e){
        var msg = esc((e && e.message) || e);
        document.getElementById('app').innerHTML = '<p>No se pudo cargar. Revisa tu internet.</p><p style="font-size:15px;opacity:.7">' + msg + '</p><button onclick="cargar()">Intentar de nuevo</button>';
      });
  }

  function pintar(d){
    var total = d.calles.reduce(function(a, c){ return a + c.numeros.length; }, 0);
    var h = '<h1>🍬 Casas que dan dulces</h1><div class="total">' + total + (total === 1 ? ' casa' : ' casas') + '</div>';
    if (!total) h += '<p>Todavía no hay casas registradas.</p>';
    d.calles.forEach(function(c){
      h += '<div class="calle"><h2>Manzana ' + esc(c.calle) + '</h2><div class="chips">';
      c.numeros.forEach(function(n){ h += '<div class="chip">' + esc(n) + esc(c.calle) + '</div>'; });
      h += '</div></div>';
    });
    h += '<button onclick="cargar()">Actualizar</button><p class="nota">Actualizado: ' + esc(d.actualizado) + '</p>';
    document.getElementById('app').innerHTML = h;
  }

  cargar();
</script>
</body>
</html>
